workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - publish

default:
  image: python:3.14-slim
  before_script:
    - python --version
    - >-
      python -m pip install --disable-pip-version-check
      "pip==${PYLCL_CI_PIP_VERSION}"

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYLCL_CI_PIP_VERSION: "25.3"
  PYPI_REPOSITORY_URL: "https://upload.pypi.org/legacy/"

cache:
  key: "pylcl-python-3.14"
  paths:
    - .cache/pip

verify:
  stage: verify
  script:
    - python -m pip install --disable-pip-version-check --group dev
    - python -m pip check
    - python -m scripts.build_package --output dist
    - >-
      export PACKAGE_VERSION="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())[
      "project"]["version"])')"
    - test -f "dist/pylcl-${PACKAGE_VERSION}.tar.gz"
    - test -f "dist/pylcl-${PACKAGE_VERSION}-py3-none-any.whl"
    - test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
    - python -m scripts.quality
    - python -m coverage xml -o coverage.xml
    - >-
      python -c "from pathlib import Path; from scripts.inspect_package import inspect_sdist,
      inspect_wheel; inspect_sdist(next(Path('dist').glob('*.tar.gz')));
      inspect_wheel(next(Path('dist').glob('*.whl'))); print('package inspection: PASS')"
  coverage: '/TOTAL.*\s(\d+(?:\.\d+)?%)/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage.xml
      - dist/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

publish-artifactory:
  stage: publish
  needs:
    - job: verify
      artifacts: true
  before_script:
    - python --version
    - >-
      python -m pip install --disable-pip-version-check
      "pip==${PYLCL_CI_PIP_VERSION}"
    - python -m pip install --disable-pip-version-check --group publish
  script:
    - ': "${ARTIFACTORY_REPOSITORY_URL:?Set ARTIFACTORY_REPOSITORY_URL in CI/CD variables}"'
    - ': "${ARTIFACTORY_USERNAME:?Set ARTIFACTORY_USERNAME in CI/CD variables}"'
    - ': "${ARTIFACTORY_PASSWORD:?Set ARTIFACTORY_PASSWORD in CI/CD variables}"'
    - python -m twine check dist/*
    - export TWINE_USERNAME="${ARTIFACTORY_USERNAME}"
    - export TWINE_PASSWORD="${ARTIFACTORY_PASSWORD}"
    - python -m twine upload --non-interactive --repository-url "${ARTIFACTORY_REPOSITORY_URL}" dist/*
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: false
    - when: never

publish-pypi:
  stage: publish
  needs:
    - job: verify
      artifacts: true
  before_script:
    - python --version
    - >-
      python -m pip install --disable-pip-version-check
      "pip==${PYLCL_CI_PIP_VERSION}"
    - python -m pip install --disable-pip-version-check --group publish
  script:
    - ': "${PYPI_USERNAME:?Set PYPI_USERNAME in CI/CD variables}"'
    - ': "${PYPI_PASSWORD:?Set PYPI_PASSWORD in CI/CD variables}"'
    - python -m twine check dist/*
    - export TWINE_USERNAME="${PYPI_USERNAME}"
    - export TWINE_PASSWORD="${PYPI_PASSWORD}"
    - python -m twine upload --non-interactive --repository-url "${PYPI_REPOSITORY_URL}" dist/*
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: false
    - when: never
