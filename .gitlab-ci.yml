workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - build
  - publish

default:
  image: python:3.14-slim
  before_script:
    - python --version
    - >-
      python -m pip install --disable-pip-version-check
      "pip==${LCLANG_CI_PIP_VERSION}"

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  LCLANG_CI_PIP_VERSION: "25.3"
  PYPI_REPOSITORY_URL: "https://upload.pypi.org/legacy/"

cache:
  key: "lclang-python-3.14"
  paths:
    - .cache/pip

verify:
  stage: verify
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - python -m pip install --disable-pip-version-check --group dev
    - python -m pip check
    - python -m scripts.quality
    - python -m coverage xml -o coverage.xml
  coverage: '/TOTAL.*\s(\d+(?:\.\d+)?%)/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build:
  stage: build
  needs: [verify]
  script:
    - python -m pip install --disable-pip-version-check --group build
    - python -m scripts.build_package --output dist
  artifacts:
    expire_in: 1 week
    paths:
      - dist/
  rules:
    - if: '$CI_COMMIT_TAG'

publish-artifactory:
  stage: publish
  needs:
    - job: build
      artifacts: true
  before_script:
    - python --version
    - >-
      python -m pip install --disable-pip-version-check
      "pip==${LCLANG_CI_PIP_VERSION}"
    - python -m pip install --disable-pip-version-check --group publish
  script:
    - ': "${ARTIFACTORY_REPOSITORY_URL:?Set ARTIFACTORY_REPOSITORY_URL in CI/CD variables}"'
    - ': "${ARTIFACTORY_USERNAME:?Set ARTIFACTORY_USERNAME in CI/CD variables}"'
    - ': "${ARTIFACTORY_PASSWORD:?Set ARTIFACTORY_PASSWORD in CI/CD variables}"'
    - export TWINE_USERNAME="${ARTIFACTORY_USERNAME}"
    - export TWINE_PASSWORD="${ARTIFACTORY_PASSWORD}"
    - python -m twine upload --non-interactive --repository-url "${ARTIFACTORY_REPOSITORY_URL}" dist/*
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: false
    - when: never

publish-pypi:
  stage: publish
  needs:
    - job: build
      artifacts: true
  before_script:
    - python --version
    - >-
      python -m pip install --disable-pip-version-check
      "pip==${LCLANG_CI_PIP_VERSION}"
    - python -m pip install --disable-pip-version-check --group publish
  script:
    - ': "${PYPI_USERNAME:?Set PYPI_USERNAME in CI/CD variables}"'
    - ': "${PYPI_PASSWORD:?Set PYPI_PASSWORD in CI/CD variables}"'
    - export TWINE_USERNAME="${PYPI_USERNAME}"
    - export TWINE_PASSWORD="${PYPI_PASSWORD}"
    - python -m twine upload --non-interactive --repository-url "${PYPI_REPOSITORY_URL}" dist/*
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: false
    - when: never
