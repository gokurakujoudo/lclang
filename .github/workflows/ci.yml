name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a tag build, or publish the release branch to PyPI
        type: choice
        default: none
        options:
          - none
          - pypi
          - artifactory

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  LCLANG_CI_PIP_VERSION: '25.3'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate publishing ref
        if: github.event_name == 'workflow_dispatch' && inputs.publish != 'none'
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          REGISTRY: ${{ inputs.publish }}
        run: test "$REF_TYPE" = tag || { test "$REF" = refs/heads/release && test "$REGISTRY" = pypi; }
      - name: Validate release source and version
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/release') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish == 'pypi')
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          VERSION=$(python -m scripts.release_notes --output "$RUNNER_TEMP/release-notes.md")
          if [ "$REF_TYPE" = tag ]; then test "$REF_NAME" = "$VERSION"; fi
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$GITHUB_SHA"
          fi
      - run: python -m pip install "pip==${LCLANG_CI_PIP_VERSION}"
      - run: python -m pip install --group dev
      - run: python -m pip check
      - run: python -m scripts.quality
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: reports/tests-*.xml
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            reports/coverage.xml
            reports/coverage.json
            reports/htmlcov/
            .coverage
          include-hidden-files: true
          retention-days: 7

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install "pip==${LCLANG_CI_PIP_VERSION}"
      - run: python -m pip install --group build
      - run: python -m scripts.build_package --output dist
      - run: python -m scripts.export_wiki build/wiki
      - uses: actions/upload-artifact@v7
        with:
          name: wiki
          path: build/wiki/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  pages:
    if: github.event_name == 'push' && github.ref_name == (vars.PAGES_SOURCE_BRANCH || github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - uses: actions/deploy-pages@v4
        id: deployment

  publish-pypi:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/release') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == 'pypi' &&
      (github.ref_type == 'tag' || github.ref == 'refs/heads/release'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/lclang/
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Create matching tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -m scripts.release_notes --output "$RUNNER_TEMP/release-notes.md")
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "lclang $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" \
              --title "lclang $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
          gh release upload "$VERSION" dist/* --clobber

  publish-artifactory:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'artifactory' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: artifactory
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install "pip==${LCLANG_CI_PIP_VERSION}"
      - run: python -m pip install --group publish
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Upload to Artifactory
        env:
          TWINE_REPOSITORY_URL: ${{ vars.ARTIFACTORY_REPOSITORY_URL }}
          TWINE_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        run: |
          : "${TWINE_REPOSITORY_URL:?Configure the registry URL}"
          : "${TWINE_USERNAME:?Configure the registry username secret}"
          : "${TWINE_PASSWORD:?Configure the registry password secret}"
          python -m twine upload --non-interactive dist/*
