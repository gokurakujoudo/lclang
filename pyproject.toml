[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "lclang"
version = "1.0.2"
description = "A typed, async-first configuration expression language"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RuntimeRomance" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://jihulab.com/midnightprotocol/lclang/-/tree/main/docs"
Issues = "https://jihulab.com/midnightprotocol/lclang/-/work_items"
Source = "https://jihulab.com/midnightprotocol/lclang"

[dependency-groups]
dev = [
  "build==1.5.0",
  "hatchling==1.31.0",
  "hypothesis==6.165.0",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.1",
]
publish = ["twine==6.2.0"]

[tool.pytest.ini_options]
addopts = [
  "-p",
  "no:cacheprovider",
  "--strict-config",
  "--strict-markers",
  "--cov=lclang",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]
asyncio_mode = "strict"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "docs: documentation structure and executable-example checks",
  "release: artifact, clean-install, portability, and release-candidate checks",
]

[tool.coverage.run]
branch = true
source = ["lclang"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/lclang", "tests", "scripts"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["ASYNC", "B", "D", "E", "F", "I", "SIM", "UP"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D102"]

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/docs",
  "/progress.md",
  "/src/lclang",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lclang"]
