[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pylcl"
version = "0.0.0"
description = "A typed, async-first configuration expression language"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pylcl contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://github.com/pylcl/pylcl#readme"
Issues = "https://github.com/pylcl/pylcl/issues"
Source = "https://github.com/pylcl/pylcl"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "hatchling>=1.27,<2",
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = [
  "-p",
  "no:cacheprovider",
  "--strict-config",
  "--strict-markers",
  "--cov=pylcl",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=99",
]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pylcl"]

[tool.coverage.report]
fail_under = 99
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.14"
strict = true
files = ["pylcl", "tests", "scripts"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["ASYNC", "B", "D", "E", "F", "I", "SIM", "UP"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D102"]

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/LICENSE",
  "/README.md",
  "/README_cn.md",
  "/docs",
  "/doc_cn",
  "/progress.md",
  "/pylcl",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["pylcl"]
